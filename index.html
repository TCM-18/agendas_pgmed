<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #1a1a2e; }
 
  .header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 700; color: #1a1a2e; }
  .header .subtitle { font-size: 12px; color: #64748b; margin-top: 2px; }
  .badge { background: #eff6ff; color: #2563eb; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; border: 1px solid #bfdbfe; }
 
  .container { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
 
  /* Month tabs */
  .month-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; border: 1.5px solid #e2e8f0; background: #fff; color: #64748b; transition: all .15s; }
  .tab:hover { border-color: #2563eb; color: #2563eb; }
  .tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
 
  /* KPI cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid #e2e8f0; }
  .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: #94a3b8; margin-bottom: 6px; }
  .kpi-value { font-size: 28px; font-weight: 700; color: #1a1a2e; line-height: 1; }
  .kpi-sub { font-size: 12px; color: #64748b; margin-top: 4px; }
  .kpi-trend { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; margin-top: 6px; }
  .trend-up { background: #dcfce7; color: #16a34a; }
  .trend-down { background: #fee2e2; color: #dc2626; }
  .trend-warn { background: #fef9c3; color: #ca8a04; }
 
  .kpi-occ-high { border-left: 4px solid #16a34a; }
  .kpi-occ-mid  { border-left: 4px solid #f59e0b; }
  .kpi-occ-low  { border-left: 4px solid #ef4444; }
 
  /* Charts row */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .chart-card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; }
  .chart-title { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 14px; }
  .chart-wrap { position: relative; height: 240px; }
 
  /* Table card */
  .table-card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
  .table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .table-title { font-size: 13px; font-weight: 700; color: #334155; }
  .filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  select, input { font-size: 12px; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; color: #334155; outline: none; }
  select:focus, input:focus { border-color: #2563eb; }
 
  /* Unidade/especialidade tables */
  .breakdown-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .breakdown-card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; }
  .breakdown-title { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 14px; }
 
  table.breakdown-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.breakdown-table th { text-align: left; padding: 7px 10px; background: #f8fafc; color: #64748b; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid #e2e8f0; }
  table.breakdown-table td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; color: #334155; }
  table.breakdown-table tr:last-child td { border-bottom: none; }
 
  .occ-bar-wrap { background: #f1f5f9; border-radius: 4px; height: 6px; width: 100%; margin-top: 3px; }
  .occ-bar { height: 6px; border-radius: 4px; }
  .occ-high { background: #16a34a; }
  .occ-mid  { background: #f59e0b; }
  .occ-low  { background: #ef4444; }
 
  /* Grid.js overrides */
  .gridjs-wrapper { border-radius: 8px; overflow: hidden; }
  .gridjs-th { font-size: 11px !important; text-transform: uppercase; letter-spacing: .4px; background: #f8fafc !important; }
  .gridjs-td { font-size: 12px !important; }
  .gridjs-search input { font-size: 12px !important; }
 
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #94a3b8; margin-bottom: 10px; }
</style>
</head>

let chartComp = null;
 
// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function occClass(v) {
  if (v >= 80) return 'occ-high';
  if (v >= 50) return 'occ-mid';
  return 'occ-low';
}
 
function occBarColor(v) {
  if (v >= 80) return '#16a34a';
  if (v >= 50) return '#f59e0b';
  return '#ef4444';
}
 
function fmt(v, decimals=1) {
  return v != null ? v.toFixed(decimals) : '—';
}
 
function fmtPct(v) {
  return v != null ? `${v.toFixed(1)}%` : '—';
}
 
// ─────────────────────────────────────────
// RENDER KPI
// ─────────────────────────────────────────
function renderKPI(month) {
  const d = DATA[month].totals;
  const labels = [
    { label: 'Slots da Prática', val: d.slots_pratica.toLocaleString('pt-BR'), sub: `+${d.slots_extra.toLocaleString('pt-BR')} extras`, extra: '' },
    { label: 'Slots Totais', val: d.slots_total.toLocaleString('pt-BR'), sub: 'incluindo extras', extra: '' },
    { label: 'Agendamentos', val: d.agendamentos.toLocaleString('pt-BR'), sub: 'confirmados no mês', extra: '' },
    { label: 'Ocupação do Mês', val: fmtPct(d.ocupacao), sub: `Overbooking: ${fmtPct(d.overbooking)}`, extra: d.ocupacao }
  ];
 
  const grid = document.getElementById('kpi-grid');
  grid.innerHTML = labels.map((k, i) => {
    let borderClass = '';
    if (i === 3) {
      borderClass = d.ocupacao >= 80 ? 'kpi-occ-high' : d.ocupacao >= 50 ? 'kpi-occ-mid' : 'kpi-occ-low';
    }
    return `
      <div class="kpi-card ${borderClass}">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.val}</div>
        <div class="kpi-sub">${k.sub}</div>
      </div>`;
  }).join('');
}

    Object.entries(d.unidade).sort((a,b) => {
      const oa = a[1].agendamentos/a[1].slots_total;
      const ob = b[1].agendamentos/b[1].slots_total;
      return ob - oa;
    }).map(([u, s]) => {
      const occ = s.slots_total > 0 ? (s.agendamentos / s.slots_total * 100) : 0;
      const color = occBarColor(occ);
      return `<tr>
        <td><strong>${u}</strong></td>
        <td>${s.slots_total.toLocaleString('pt-BR')}</td>
        <td>${s.agendamentos.toLocaleString('pt-BR')}</td>
        <td>
          <span style="font-weight:600;color:${color}">${occ.toFixed(1)}%</span>
          <div class="occ-bar-wrap"><div class="occ-bar" style="width:${Math.min(occ,100)}%;background:${color}"></div></div>
        </td>
        <td>${s.praticas}</td>
      </tr>`;
    }).join('') + `</tbody>`;
 
  // Especialidade
  const eTable = document.getElementById('table-especialidade');
  eTable.innerHTML = `
    <thead><tr><th>Especialidade</th><th>Slots</th><th>Agend.</th><th>Ocupação</th></tr></thead>
    <tbody>` +
    Object.entries(d.especialidade).sort((a,b) => {
      const oa = a[1].agend/a[1].slots;
      const ob = b[1].agend/b[1].slots;
      return ob - oa;
    }).map(([e, s]) => {
      const occ = s.slots > 0 ? (s.agend / s.slots * 100) : 0;
      const color = occBarColor(occ);
      return `<tr>
        <td><strong>${e}</strong></td>
        <td>${s.slots.toLocaleString('pt-BR')}</td>
        <td>${s.agend.toLocaleString('pt-BR')}</td>
        <td>
          <span style="font-weight:600;color:${color}">${occ.toFixed(1)}%</span>
          <div class="occ-bar-wrap"><div class="occ-bar" style="width:${Math.min(occ,100)}%;background:${color}"></div></div>
        </td>
      </tr>`;
    }).join('') + `</tbody>`;
}
 
// ─────────────────────────────────────────
// RENDER CHARTS
// ─────────────────────────────────────────
function renderCharts(month) {
  const d = DATA[month];
 
  // Chart 1 — Unidade
  const uLabels = Object.keys(d.unidade);
  const uOcc = uLabels.map(u => {
    const s = d.unidade[u];
    return s.slots_total > 0 ? +(s.agendamentos / s.slots_total * 100).toFixed(1) : 0;
  });
  const uColors = uOcc.map(v => occBarColor(v));
 
  if (chartUnidade) chartUnidade.destroy();
  chartUnidade = new Chart(document.getElementById('chart-unidade'), {
    type: 'bar',
    data: {
      labels: uLabels,
      datasets: [{
        label: 'Ocupação (%)',
        data: uOcc,
        backgroundColor: uColors,
        borderRadius: 6,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y}%` } } },
      scales: {
        y: { max: 120, ticks: { callback: v => v + '%' }, grid: { color: '#f1f5f9' } },
        x: { grid: { display: false } }
      }
    }
  });
 
  // Chart 2 — Especialidade
  const eEntries = Object.entries(d.especialidade).map(([e, s]) => ({
    label: e,
    occ: s.slots > 0 ? +(s.agend / s.slots * 100).toFixed(1) : 0
  })).sort((a, b) => b.occ - a.occ);
 
  if (chartEsp) chartEsp.destroy();
  chartEsp = new Chart(document.getElementById('chart-especialidade'), {
    type: 'bar',
    data: {
      labels: eEntries.map(e => e.label),
      datasets: [{
        label: 'Ocupação (%)',
        data: eEntries.map(e => e.occ),
        backgroundColor: eEntries.map(e => occBarColor(e.occ)),
        borderRadius: 4,
        borderSkipped: false
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x}%` } } },
      scales: {
        x: { max: 120, ticks: { callback: v => v + '%' }, grid: { color: '#f1f5f9' } },
        y: { grid: { display: false }, ticks: { font: { size: 11 } } }
      }
    }
  });
}
 
// ─────────────────────────────────────────
// COMPARATIVO
// ─────────────────────────────────────────
function renderComparativo() {
  const months = ['junho', 'julho', 'agosto'];
  const labels = ['Junho', 'Julho', 'Agosto'];
 
  // Overall occ
  const overallOcc = months.map(m => DATA[m].totals.ocupacao);
  const overallOvb = months.map(m => DATA[m].totals.overbooking);
 
  // By unidade
  const unidades = ['BSB', 'CPS', 'ONL', 'SP'];
  const unidadeDatasets = unidades.map((u, i) => {
    const colors = ['#6366f1', '#2563eb', '#0ea5e9', '#06b6d4'];
    return {
      label: u,
      data: months.map(m => {
        const s = DATA[m].unidade[u];
        return s.slots_total > 0 ? +(s.agendamentos / s.slots_total * 100).toFixed(1) : 0;
      }),
      borderColor: colors[i],
      backgroundColor: colors[i] + '22',
      borderWidth: 2,
      tension: 0.3,
      pointRadius: 5,
      fill: false
    };
  });
 
  if (chartComp) chartComp.destroy();
  chartComp = new Chart(document.getElementById('chart-comparativo'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Ocupação Geral',
          data: overallOcc,
          borderColor: '#2563eb',
          backgroundColor: '#2563eb22',
          borderWidth: 3,
          tension: 0.3,
          pointRadius: 6,
          fill: false
        },
        {
          label: 'Overbooking',
          data: overallOvb,
          borderColor: '#f59e0b',
          backgroundColor: '#f59e0b22',
          borderWidth: 2,
          borderDash: [5,5],
          tension: 0.3,
          pointRadius: 5,
          fill: false
        },
        ...unidadeDatasets
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}%` } }
      },
      scales: {
        y: { ticks: { callback: v => v + '%' }, grid: { color: '#f1f5f9' } },
        x: { grid: { display: false } }
      }
    }
  });
}
 
// ─────────────────────────────────────────
// RENDER GRID
// ─────────────────────────────────────────
function renderGrid(month) {
  const rows = DATA[month].rows;
 
  const gridData = rows.map(r => [
    r.turma,
    r.unidade,
    r.data ? r.data.slice(5).split('-').reverse().join('/') : '—',
    r.slots_total != null ? r.slots_total : '—',
    r.agendamentos != null ? r.agendamentos : '—',
    r.ocupacao != null ? r.ocupacao + '%' : '—',
    r.paga || '—'
  ]);
 
  const wrapper = document.getElementById('grid-wrapper');
  wrapper.innerHTML = '';
 
  if (gridInstance) {
    gridInstance.destroy();
    gridInstance = null;
  }
 
  gridInstance = new gridjs.Grid({
    columns: [
      { name: 'Turma', width: '220px' },
      { name: 'Unidade', width: '80px' },
      { name: 'Data', width: '80px' },
      { name: 'Slots', width: '70px' },
      { name: 'Agend.', width: '70px' },
      { name: 'Ocupação', width: '90px' },
      { name: 'Paga', width: '70px' }
    ],
    data: gridData,
    search: true,
    sort: true,
    pagination: { limit: 10 },
    style: {
      th: { 'background-color': '#f8fafc', 'font-size': '11px' },
      td: { 'font-size': '12px' }
    }
  }).render(wrapper);
}
 
// ─────────────────────────────────────────
// SET MONTH
// ─────────────────────────────────────────
function setMonth(month) {
  currentMonth = month;
 
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
 
  const isComp = month === 'comparativo';
 
  document.getElementById('kpi-section').style.display = isComp ? 'none' : 'block';
  document.getElementById('charts-row').style.display = isComp ? 'none' : 'grid';
  document.getElementById('breakdown-row').style.display = isComp ? 'none' : 'grid';
  document.getElementById('detail-card').style.display = isComp ? 'none' : 'block';
  document.getElementById('comparativo-chart').style.display = isComp ? 'block' : 'none';
 
  if (!isComp) {
    renderKPI(month);
    renderBreakdown(month);
    renderCharts(month);
    renderGrid(month);
  } else {
    renderComparativo();
  }
}
 
// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  renderKPI('junho');
  renderBreakdown('junho');
  renderCharts('junho');
  renderGrid('junho');
});
</script>
